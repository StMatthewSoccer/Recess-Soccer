<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saint Matthews Recess Soccer Live Stats</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 50% -10%, rgba(45,130,85,.35), transparent 45%),
    linear-gradient(135deg, #06100b, #0b1e14 50%, #050c08);
  min-height: 100vh;
}

.container {
  width: 96%;
  max-width: 1250px;
  margin: auto;
  padding: 15px 0 45px;
}

header {
  text-align: center;
  margin-bottom: 15px;
}

header h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 40px);
}

header p {
  margin: 5px 0 0;
  color: #9bb9a7;
  font-size: 13px;
}

.card {
  background: rgba(14, 30, 22, .92);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 15px;
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
  backdrop-filter: blur(10px);
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 11px;
}

.section-header h2 {
  margin: 0;
  font-size: 20px;
}

.status {
  color: #9dbbaa;
  font-size: 11px;
}

.login-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

select,
input[type="password"] {
  background: #091a11;
  color: white;
  border: 1px solid #31513f;
  border-radius: 8px;
  padding: 9px;
}

button {
  border: 0;
  border-radius: 8px;
  color: white;
  background: #17452f;
  font-weight: 700;
  cursor: pointer;
  transition: .15s;
}

button:hover:not(:disabled) {
  background: #256747;
  transform: translateY(-1px);
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
  transform: none;
}

.login-btn,
.logout-btn,
.save-btn {
  padding: 9px 13px;
}

.hidden {
  display: none !important;
}

.login-status {
  width: 100%;
  color: #9dbbaa;
  font-size: 12px;
  margin-top: 3px;
}

.firebase-good {
  color: #6ed49e;
}

.firebase-bad {
  color: #e78383;
}


/* =========================
   STAT BOARD
========================= */

.sort-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 10px;
}

.sort-btn {
  padding: 6px 9px;
  font-size: 11px;
}

.sort-btn.active {
  background: #2c8c60;
}

.table-wrap {
  overflow-x: auto;
  border-radius: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

th,
td {
  padding: 7px 6px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

th {
  color: #9fbdad;
  font-size: 10px;
  text-transform: uppercase;
}

td {
  font-size: 13px;
}

th:first-child,
td:first-child {
  text-align: left;
}

td:first-child {
  font-weight: 800;
}


/* =========================
   PLAYER STATS
========================= */

.editor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 9px;
}

.player-card {
  background: rgba(4,15,10,.68);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px;
  padding: 10px;
}

.player-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
}

.player-title {
  font-size: 15px;
  font-weight: 800;
}

.lock-label {
  font-size: 10px;
  color: #8fa99a;
}

.edit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  margin: 4px 0;
}

.edit-label {
  font-size: 11px;
  color: #a7c0b1;
}

.counter {
  display: flex;
  align-items: center;
  gap: 4px;
}

.counter button {
  width: 27px;
  height: 27px;
  font-size: 17px;
}

.counter-value {
  width: 25px;
  text-align: center;
  font-size: 13px;
  font-weight: 800;
}

.ga-value {
  font-weight: 800;
  min-width: 25px;
  text-align: center;
  color: #bfe3cf;
}

.notice {
  padding: 10px;
  border-radius: 8px;
  background: rgba(225,175,60,.08);
  border: 1px solid rgba(225,175,60,.12);
  color: #cdbf96;
  font-size: 12px;
}


/* =========================
   RANKINGS
========================= */

.ranking-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 15px;
}

.trophy {
  display: block;
  width: 72px;
  height: 72px;
  object-fit: contain;
  margin: 0 auto 5px;
}

.ranking-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.rank-row {
  display: grid;
  grid-template-columns: 31px 1fr 28px 28px;
  gap: 5px;
  align-items: center;
  background: rgba(255,255,255,.045);
  padding: 6px;
  border-radius: 8px;
}

.rank-number {
  color: #9eb9a8;
  font-weight: 800;
  text-align: center;
  font-size: 12px;
}

.rank-name {
  font-size: 13px;
  font-weight: 700;
}

.arrow-btn {
  width: 28px;
  height: 28px;
  font-size: 14px;
}

.save-container {
  text-align: center;
  margin-top: 9px;
}

@media(max-width:700px) {
  .ranking-grid {
    grid-template-columns: 1fr;
  }

  .editor-grid {
    grid-template-columns: 1fr;
  }

  .container {
    width: 98%;
  }

  .card {
    padding: 10px;
  }

  .login-row > * {
    width: 100%;
  }
}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =====================================================
   PLAYER LIST
===================================================== */

const PLAYER_NAMES = [
  "Adi",
  "Aidan",
  "Artin",
  "Angelo",
  "Bryson",
  "Cameron",
  "Jack",
  "John",
  "Leonardo",
  "Marc",
  "Matthew",
  "Sami",
  "Nathan",
  "Theo"
];


/* =====================================================
   DEFAULT STATS
===================================================== */

const DEFAULT_STATS = {
  goals: 0,
  assists: 0,
  saves: 0,
  cleanSheets: 0,
  yellowCards: 0,
  redCards: 0,
  mvps: 0
};


/* =====================================================
   LOCAL DATA
===================================================== */

let playerStats = {};

PLAYER_NAMES.forEach(name => {
  playerStats[name] = {
    ...DEFAULT_STATS
  };
});


let ballonRanking = [...PLAYER_NAMES];
let defenceRanking = [...PLAYER_NAMES];

let currentSort = "default";

let firebaseReady = false;
let auth = null;
let db = null;


/* =====================================================
   EDITOR ACCOUNTS
===================================================== */

const EDITOR_ACCOUNTS = {

  jack: {
    email: "jmaso12.home@gmail.com",
    name: "Jack"
  },

  jackschool: {
    email: "jack.mason1@stu.ocsb.ca",
    name: "Jack (School)"
  },

  leonardo: {
    email: "leonardo.ljubicic@stu.ocsb.ca",
    name: "Leonardo"
  },

  angelo: {
    email: "angelo.champagne@stu.ocsb.ca",
    name: "Angelo"
  }

};


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyCyXvJ6kIxdE5Nj-J0YEfipH7CMNZa_RUI",
  authDomain: "recess-soccer.firebaseapp.com",
  databaseURL: "https://recess-soccer-default-rtdb.firebaseio.com",
  projectId: "recess-soccer",
  storageBucket: "recess-soccer.firebasestorage.app",
  messagingSenderId: "872558689342",
  appId: "1:872558689342:web:ea87d5593bbb51d6d6656f",
  measurementId: "G-B2SWDJJ8F6"
};

  apiKey:
    "AIzaSyCyXvJ6IxdE5Nj-J-0YEfipH7CMNZa_RUI",

  authDomain:
    "recess-soccer.firebaseapp.com",

  databaseURL:
    "https://recess-soccer-default-rtdb.firebaseio.com",

  projectId:
    "recess-soccer",

  storageBucket:
    "recess-soccer.firebasestorage.app",

  messagingSenderId:
    "872558689342",

  appId:
    "1:872558689342:web:a4dca17e1d6b963ed6656f",

  measurementId:
    "G-HJ16JSL5Q2"
};


/* =====================================================
   HELPER FUNCTIONS
===================================================== */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function cleanStats(stats) {

  return {
    goals: Math.max(0, Number(stats?.goals) || 0),
    assists: Math.max(0, Number(stats?.assists) || 0),
    saves: Math.max(0, Number(stats?.saves) || 0),
    cleanSheets: Math.max(0, Number(stats?.cleanSheets) || 0),
    yellowCards: Math.max(0, Number(stats?.yellowCards) || 0),
    redCards: Math.max(0, Number(stats?.redCards) || 0),
    mvps: Math.max(0, Number(stats?.mvps) || 0)
  };

}


function setFirebaseStatus(message, good = true) {

  const element =
    document.getElementById("firebaseStatus");

  if (!element) return;

  element.textContent = message;

  element.classList.remove(
    "firebase-good",
    "firebase-bad"
  );

  element.classList.add(
    good ? "firebase-good" : "firebase-bad"
  );

}


/* =====================================================
   STAT BOARD
===================================================== */

function renderStatBoard() {

  const body =
    document.getElementById("statBoardBody");

  if (!body) return;

  let names = [...PLAYER_NAMES];

  if (currentSort !== "default") {

    names.sort((a, b) => {

      const A =
        playerStats[a] || DEFAULT_STATS;

      const B =
        playerStats[b] || DEFAULT_STATS;

      let aValue;
      let bValue;

      if (currentSort === "ga") {

        aValue =
          (Number(A.goals) || 0) +
          (Number(A.assists) || 0);

        bValue =
          (Number(B.goals) || 0) +
          (Number(B.assists) || 0);

      } else {

        aValue =
          Number(A[currentSort]) || 0;

        bValue =
          Number(B[currentSort]) || 0;

      }

      return bValue - aValue;

    });

  }

  body.innerHTML = "";

  names.forEach(name => {

    const stats =
      playerStats[name] || DEFAULT_STATS;

    const goals =
      Number(stats.goals) || 0;

    const assists =
      Number(stats.assists) || 0;

    const row =
      document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHTML(name)}</td>
      <td>${goals}</td>
      <td>${assists}</td>
      <td><strong>${goals + assists}</strong></td>
      <td>${Number(stats.saves) || 0}</td>
      <td>${Number(stats.cleanSheets) || 0}</td>
      <td>${Number(stats.yellowCards) || 0}</td>
      <td>${Number(stats.redCards) || 0}</td>
      <td>${Number(stats.mvps) || 0}</td>
    `;

    body.appendChild(row);

  });

}


/* =====================================================
   PLAYER STATS
===================================================== */

function renderEditor() {

  const container =
    document.getElementById("editorContent");

  if (!container) return;

  const canEdit =
    !!(auth && auth.currentUser);

  const editorStatus =
    document.getElementById("editorStatus");

  if (editorStatus) {

    editorStatus.textContent =
      canEdit
        ? "✏️ Editing enabled"
        : "🔒 View only";

    editorStatus.classList.toggle(
      "firebase-good",
      canEdit
    );

  }

  container.innerHTML = "";

  const grid =
    document.createElement("div");

  grid.className =
    "editor-grid";

  PLAYER_NAMES.forEach(name => {

    const stats =
      playerStats[name] || DEFAULT_STATS;

    const card =
      document.createElement("div");

    card.className =
      "player-card";

    card.innerHTML = `

      <div class="player-title-row">

        <div class="player-title">
          ${escapeHTML(name)}
        </div>

        <div class="lock-label">
          ${canEdit ? "EDITING" : "VIEW ONLY"}
        </div>

      </div>

      ${makeEditRow(name, "goals", "Goals", canEdit)}

      ${makeEditRow(name, "assists", "Assists", canEdit)}

      ${makeEditRow(name, "saves", "Goalie Saves", canEdit)}

      ${makeEditRow(name, "cleanSheets", "Clean Sheets", canEdit)}

      ${makeEditRow(name, "yellowCards", "Yellow Cards", canEdit)}

      ${makeEditRow(name, "redCards", "Red Cards", canEdit)}

      ${makeEditRow(name, "mvps", "MVPs", canEdit)}

      <div class="edit-row">

        <span class="edit-label">
          G+A
        </span>

        <span class="ga-value">
          ${
            (Number(stats.goals) || 0) +
            (Number(stats.assists) || 0)
          }
        </span>

      </div>
    `;

    grid.appendChild(card);

  });

  container.appendChild(grid);

}


function makeEditRow(name, stat, label, canEdit) {

  const value =
    Number(
      (playerStats[name] || DEFAULT_STATS)[stat]
    ) || 0;

  const encoded =
    encodeURIComponent(name);

  return `

    <div class="edit-row">

      <span class="edit-label">
        ${label}
      </span>

      <div class="counter">

        <button
          type="button"
          ${canEdit ? "" : "disabled"}
          onclick="changeStat('${encoded}','${stat}',-1)"
        >
          −
        </button>

        <span class="counter-value">
          ${value}
        </span>

        <button
          type="button"
          ${canEdit ? "" : "disabled"}
          onclick="changeStat('${encoded}','${stat}',1)"
        >
          +
        </button>

      </div>

    </div>
  `;

}


/* =====================================================
   CHANGE STAT
===================================================== */

window.changeStat =
function(encodedName, stat, amount) {

  if (!auth || !auth.currentUser) {

    alert(
      "You must sign in before editing stats."
    );

    return;
  }

  const name =
    decodeURIComponent(encodedName);

  if (!PLAYER_NAMES.includes(name)) {
    return;
  }

  const validStats = [
    "goals",
    "assists",
    "saves",
    "cleanSheets",
    "yellowCards",
    "redCards",
    "mvps"
  ];

  if (!validStats.includes(stat)) {
    return;
  }

  if (!playerStats[name]) {

    playerStats[name] = {
      ...DEFAULT_STATS
    };

  }

  const oldValue =
    Number(playerStats[name][stat]) || 0;

  const newValue =
    Math.max(0, oldValue + amount);

  playerStats[name][stat] =
    newValue;

  renderStatBoard();
  renderEditor();

  saveStat(
    name,
    stat,
    newValue
  );

};


/* =====================================================
   SAVE STAT
===================================================== */

function saveStat(name, stat, value) {

  if (
    !firebaseReady ||
    !db ||
    !auth ||
    !auth.currentUser
  ) {

    setFirebaseStatus(
      "Not connected",
      false
    );

    return;

  }

  db.ref(
    "players/" +
    name +
    "/" +
    stat
  )
  .set(value)

  .then(() => {

    setFirebaseStatus(
      "Firebase connected • Saved",
      true
    );

  })

  .catch(error => {

    console.error(
      "Firebase save error:",
      error
    );

    setFirebaseStatus(
      "Connected • Save failed",
      false
    );

    alert(
      "The stat changed on screen, but Firebase could not save it.\n\n" +
      error.message
    );

  });

}


/* =====================================================
   RANKING NORMALIZATION
===================================================== */

function normalizeRanking(data) {

  const result = [];

  if (Array.isArray(data)) {

    data.forEach(name => {

      if (
        PLAYER_NAMES.includes(name) &&
        !result.includes(name)
      ) {
        result.push(name);
      }

    });

  }

  PLAYER_NAMES.forEach(name => {

    if (!result.includes(name)) {
      result.push(name);
    }

  });

  return result;

}


/* =====================================================
   BALLON D'OR
===================================================== */

function renderBallonRanking() {

  const container =
    document.getElementById("ballonRanking");

  if (!container) return;

  container.innerHTML = "";

  const canEdit =
    !!(auth && auth.currentUser);

  ballonRanking.forEach((name, index) => {

    const row =
      document.createElement("div");

    row.className =
      "rank-row";

    row.innerHTML = `

      <span class="rank-number">
        ${index + 1}
      </span>

      <span class="rank-name">
        ${escapeHTML(name)}
      </span>

      <button
        type="button"
        class="arrow-btn"
        ${!canEdit || index === 0 ? "disabled" : ""}
        onclick="moveBallon(${index}, -1)"
      >
        ↑
      </button>

      <button
        type="button"
        class="arrow-btn"
        ${!canEdit || index === ballonRanking.length - 1 ? "disabled" : ""}
        onclick="moveBallon(${index}, 1)"
      >
        ↓
      </button>

    `;

    container.appendChild(row);

  });

}


window.moveBallon =
function(index, direction) {

  if (!auth || !auth.currentUser) {
    return;
  }

  const newIndex =
    index + direction;

  if (
    index < 0 ||
    index >= ballonRanking.length ||
    newIndex < 0 ||
    newIndex >= ballonRanking.length
  ) {
    return;
  }

  const temp =
    ballonRanking[index];

  ballonRanking[index] =
    ballonRanking[newIndex];

  ballonRanking[newIndex] =
    temp;

  renderBallonRanking();

};


/* =====================================================
   GOLDEN DEFENCE
===================================================== */

function renderDefenceRanking() {

  const container =
    document.getElementById("defenceRanking");

  if (!container) return;

  container.innerHTML = "";

  const canEdit =
    !!(auth && auth.currentUser);

  defenceRanking.forEach((name, index) => {

    const row =
      document.createElement("div");

    row.className =
      "rank-row";

    row.innerHTML = `

      <span class="rank-number">
        ${index + 1}
      </span>

      <span class="rank-name">
        ${escapeHTML(name)}
      </span>

      <button
        type="button"
        class="arrow-btn"
        ${!canEdit || index === 0 ? "disabled" : ""}
        onclick="moveDefence(${index}, -1)"
      >
        ↑
      </button>

      <button
        type="button"
        class="arrow-btn"
        ${!canEdit || index === defenceRanking.length - 1 ? "disabled" : ""}
        onclick="moveDefence(${index}, 1)"
      >
        ↓
      </button>

    `;

    container.appendChild(row);

  });

}


window.moveDefence =
function(index, direction) {

  if (!auth || !auth.currentUser) {
    return;
  }

  const newIndex =
    index + direction;

  if (
    index < 0 ||
    index >= defenceRanking.length ||
    newIndex < 0 ||
    newIndex >= defenceRanking.length
  ) {
    return;
  }

  const temp =
    defenceRanking[index];

  defenceRanking[index] =
    defenceRanking[newIndex];

  defenceRanking[newIndex] =
    temp;

  renderDefenceRanking();

};


/* =====================================================
   SAVE RANKINGS
===================================================== */

function saveRanking(type) {

  if (
    !firebaseReady ||
    !db ||
    !auth ||
    !auth.currentUser
  ) {

    alert(
      "You must be signed in to save rankings."
    );

    return;

  }

  const ranking =
    type === "ballon"
      ? ballonRanking
      : defenceRanking;

  db.ref(
    "rankings/" + type
  )
  .set(ranking)

  .then(() => {

    setFirebaseStatus(
      "Firebase connected • Ranking saved",
      true
    );

  })

  .catch(error => {

    console.error(
      "Ranking save error:",
      error
    );

    setFirebaseStatus(
      "Connected • Ranking save failed",
      false
    );

    alert(
      "Firebase could not save the ranking.\n\n" +
      error.message
    );

  });

}


/* =====================================================
   LOAD PLAYER DATA
===================================================== */

function loadPlayers() {

  if (!db) return;

  db.ref("players")
    .on(
      "value",

      snapshot => {

        const data =
          snapshot.val() || {};

        PLAYER_NAMES.forEach(name => {

          playerStats[name] =
            cleanStats(
              data[name] || DEFAULT_STATS
            );

        });

        renderStatBoard();
        renderEditor();

        setFirebaseStatus(
          "Firebase connected • Live",
          true
        );

      },

      error => {

        console.error(
          "Firebase players error:",
          error
        );

        setFirebaseStatus(
          "Firebase read failed",
          false
        );

      }
    );

}


/* =====================================================
   LOAD RANKINGS
===================================================== */

function loadRankings() {

  if (!db) return;

  db.ref("rankings")
    .on(
      "value",

      snapshot => {

        const data =
          snapshot.val() || {};

        ballonRanking =
          normalizeRanking(
            data.ballon
          );

        defenceRanking =
          normalizeRanking(
            data.defence
          );

        renderBallonRanking();
        renderDefenceRanking();

      },

      error => {

        console.error(
          "Firebase rankings error:",
          error
        );

      }
    );

}


/* =====================================================
   AUTH UI
===================================================== */

function updateAuthUI(user) {

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const password =
    document.getElementById("password");

  const loginStatus =
    document.getElementById("loginStatus");

  if (user) {

    loginBtn.classList.add("hidden");

    logoutBtn.classList.remove("hidden");

    password.value = "";

    loginStatus.textContent =
      "Signed in • Editing enabled";

    loginStatus.classList.add(
      "firebase-good"
    );

  } else {

    loginBtn.classList.remove("hidden");

    logoutBtn.classList.add("hidden");

    loginStatus.textContent =
      "View-only mode";

    loginStatus.classList.remove(
      "firebase-good"
    );

  }

  renderEditor();
  renderBallonRanking();
  renderDefenceRanking();

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const loginStatus =
    document.getElementById("loginStatus");

  const account =
    EDITOR_ACCOUNTS[username];

  if (!account) {

    loginStatus.textContent =
      "Invalid username.";

    return;

  }

  if (!password) {

    loginStatus.textContent =
      "Enter your PIN / password.";

    return;

  }

  if (!auth) {

    loginStatus.textContent =
      "Firebase Authentication is not connected.";

    return;

  }

  loginStatus.textContent =
    "Signing in...";

  try {

    await auth.signInWithEmailAndPassword(
      account.email,
      password
    );

    loginStatus.textContent =
      "Signed in as " + account.name;

  } catch (error) {

    console.error(
      "Login error:",
      error
    );

    let message =
      "Sign in failed.";

    switch (error.code) {

      case "auth/invalid-credential":
        message =
          "Incorrect PIN / password.";
        break;

      case "auth/wrong-password":
        message =
          "Incorrect PIN / password.";
        break;

      case "auth/user-not-found":
        message =
          "This Firebase account does not exist.";
        break;

      case "auth/operation-not-allowed":
        message =
          "Email/Password sign-in is not enabled in Firebase.";
        break;

      case "auth/too-many-requests":
        message =
          "Too many attempts. Try again later.";
        break;

      case "auth/network-request-failed":
        message =
          "Network error. Check your internet connection.";
        break;

      default:
        message =
          error.code +
          ": " +
          error.message;

    }

    loginStatus.textContent =
      message;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  if (!auth) return;

  try {

    await auth.signOut();

  } catch (error) {

    console.error(
      "Logout error:",
      error
    );

  }

}


/* =====================================================
   SORT BUTTONS
===================================================== */

function setupSorting() {

  document
    .querySelectorAll(".sort-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentSort =
            button.dataset.sort;

          document
            .querySelectorAll(".sort-btn")
            .forEach(btn => {

              btn.classList.toggle(
                "active",
                btn === button
              );

            });

          renderStatBoard();

        }
      );

    });

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

function setupButtons() {

  document
    .getElementById("loginBtn")
    .addEventListener(
      "click",
      login
    );

  document
    .getElementById("password")
    .addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          login();
        }

      }
    );

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      logout
    );

  document
    .getElementById("saveBallon")
    .addEventListener(
      "click",
      () => saveRanking("ballon")
    );

  document
    .getElementById("saveDefence")
    .addEventListener(
      "click",
      () => saveRanking("defence")
    );

}


/* =====================================================
   START FIREBASE
===================================================== */

function startFirebase() {

  try {

    if (
      typeof firebase === "undefined"
    ) {

      setFirebaseStatus(
        "Firebase SDK failed to load",
        false
      );

      return;

    }

    firebase.initializeApp(
      firebaseConfig
    );

    auth =
      firebase.auth();

    db =
      firebase.database();

    firebaseReady = true;

    setFirebaseStatus(
      "Firebase connected",
      true
    );


    /* -------------------------
       AUTH LISTENER
    ------------------------- */

    auth.onAuthStateChanged(
      user => {

        updateAuthUI(user);

      },

      error => {

        console.error(
          "Auth state error:",
          error
        );

        setFirebaseStatus(
          "Authentication error",
          false
        );

      }
    );


    /* -------------------------
       DATABASE LISTENERS
    ------------------------- */

    loadPlayers();

    loadRankings();

  } catch (error) {

    console.error(
      "Firebase initialization error:",
      error
    );

    setFirebaseStatus(
      "Firebase connection failed",
      false
    );

  }

}


/* =====================================================
   INITIALIZE PAGE
===================================================== */

function initializePage() {

  renderStatBoard();

  renderEditor();

  renderBallonRanking();

  renderDefenceRanking();

  setupSorting();

  setupButtons();

  startFirebase();

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  initializePage
);

</script>

</body>
</html>
