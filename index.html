<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saint Matthews Recess Soccer Live Stats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
  background:
    linear-gradient(rgba(4,18,14,.82), rgba(4,18,14,.94)),
    radial-gradient(circle at 15% 10%, #18704a, transparent 35%),
    radial-gradient(circle at 85% 80%, #0b5237, transparent 35%),
    #061a13;
  min-height: 100vh;
}

.container {
  width: min(1200px, 96%);
  margin: auto;
  padding-bottom: 40px;
}

header {
  text-align: center;
  padding: 24px 10px 18px;
}

header h1 {
  margin: 0;
  font-size: clamp(25px, 5vw, 42px);
}

header p {
  margin: 7px 0 0;
  color: #b8d8ca;
  font-size: 14px;
}

/* LOGIN */

.login-box {
  max-width: 440px;
  margin: 0 auto 22px;
  padding: 17px;
  border-radius: 15px;
  background: rgba(8,34,25,.92);
  border: 1px solid rgba(255,255,255,.1);
}

.login-box h2 {
  margin: 0 0 11px;
  font-size: 18px;
}

.login-row {
  display: flex;
  gap: 7px;
}

select,
input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #46685a;
  background: #102d23;
  color: white;
  outline: none;
}

.login-button,
.logout-button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
  border: 0;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.login-button {
  background: #249c65;
}

.logout-button {
  background: #663b3b;
}

.login-status {
  margin-top: 8px;
  font-size: 12px;
  color: #b9d8ca;
}

/* SECTION */

.section {
  margin-top: 24px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.section-heading h2 {
  margin: 0;
  font-size: 22px;
}

.editor-badge {
  display: none;
  background: #238f5e;
  padding: 5px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: bold;
}

body.editor-mode .editor-badge {
  display: inline-block;
}

/* SORT */

.sort-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 9px;
}

.sort-button {
  padding: 7px 9px;
  border-radius: 7px;
  border: 1px solid #315749;
  background: #15382b;
  color: #cce5da;
  font-size: 11px;
  cursor: pointer;
}

.sort-button.active {
  background: #249c65;
  color: white;
}

/* STAT BOARD */

.board-wrap {
  overflow-x: auto;
  border-radius: 13px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(5,25,18,.93);
}

.stat-board {
  width: 100%;
  min-width: 760px;
  border-collapse: collapse;
}

.stat-board th {
  background: #102e23;
  color: #9dd0b9;
  font-size: 10px;
  padding: 8px 4px;
  white-space: nowrap;
}

.stat-board td {
  padding: 6px 4px;
  border-top: 1px solid rgba(255,255,255,.06);
  text-align: center;
  font-size: 12px;
}

.stat-board td.name {
  text-align: left;
  padding-left: 9px;
  font-weight: bold;
  white-space: nowrap;
}

.stat-board tr:nth-child(even) {
  background: rgba(255,255,255,.025);
}

/* EDIT PLAYERS */

.editor-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.player-editor {
  background: rgba(8,31,23,.94);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px;
  padding: 11px;
}

.player-editor h3 {
  margin: 0 0 8px;
  font-size: 17px;
}

.edit-stat {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  min-height: 35px;
  border-top: 1px solid rgba(255,255,255,.055);
  gap: 6px;
}

.edit-stat:first-of-type {
  border-top: none;
}

.edit-stat-label {
  font-size: 12px;
  color: #b9d8ca;
}

.edit-controls {
  display: flex;
  align-items: center;
  gap: 5px;
}

.edit-number {
  min-width: 25px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
}

.edit-button {
  width: 27px;
  height: 27px;
  border: 0;
  border-radius: 6px;
  background: #173f30;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.edit-button:hover {
  background: #249c65;
}

body:not(.editor-mode) .edit-button {
  display: none;
}

/* RANKINGS */

.rankings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.ranking-card {
  background: rgba(7,27,20,.94);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  padding: 13px;
}

.trophy {
  width: 52px;
  height: 52px;
  object-fit: contain;
  display: block;
  margin: 0 auto 3px;
}

.ranking-card h2 {
  text-align: center;
  margin: 3px 0 11px;
  font-size: 19px;
}

.ranking-row {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 7px;
  padding: 6px 4px;
  border-top: 1px solid rgba(255,255,255,.055);
}

.rank-number {
  color: #9dd0b9;
  font-weight: bold;
  font-size: 12px;
}

.rank-name {
  font-size: 13px;
  font-weight: bold;
}

.rank-controls {
  display: flex;
  gap: 4px;
}

.rank-button {
  width: 29px;
  height: 29px;
  border: 0;
  border-radius: 6px;
  background: #173f30;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.rank-button:disabled {
  opacity: .25;
  cursor: default;
}

body:not(.editor-mode) .rank-controls {
  display: none;
}

.save-ranking {
  width: 100%;
  margin-top: 9px;
  padding: 9px;
  border: 0;
  border-radius: 8px;
  background: #246f50;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

body:not(.editor-mode) .save-ranking {
  display: none;
}

.save-message {
  text-align: center;
  margin-top: 6px;
  font-size: 11px;
  color: #9dd0b9;
}

/* MOBILE */

@media (max-width: 700px) {

  .login-row {
    flex-direction: column;
  }

  .editor-grid {
    grid-template-columns: 1fr;
  }

  .rankings-grid {
    grid-template-columns: 1fr;
  }

  .section-heading h2 {
    font-size: 19px;
  }

  .stat-board {
    min-width: 750px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Saint Matthews Recess Soccer</h1>
  <p>Live Stats & Rankings</p>
</header>

<div class="container">

  <!-- LOGIN -->

  <div class="login-box">

    <h2>🔐 Editor Login</h2>

    <div class="login-row">

      <select id="username">
        <option value="">Select username</option>
        <option value="jack">jack</option>
        <option value="jackschool">jackschool</option>
        <option value="leonardo">leonardo</option>
        <option value="angelo">angelo</option>
      </select>

      <input
        id="pin"
        type="password"
        placeholder="PIN / Password"

      >

    </div>

    <button class="login-button" id="loginButton">

    </button>

    <button

      id="logoutButton"

    >
      Sign Out
    </button>

    <div class="login-status" id="loginStatus">
      View-only mode
    </div>

  </div>


  <!-- =========================
       STAT BOARD
  ========================== -->

  <section class="section">

    <div class="section-heading">
      <h2>📊 Stat Board</h2>
      <span class="editor-badge">EDITOR MODE</span>
    </div>

    <div class="sort-buttons">

      <button class="sort-button active" data-sort="default">

      </button>

      </button>

      <button class="sort-button" data-sort="assists">

      <button class="sort-button" data-sort="ga">

      </button>

      </button>

      <button class="sort-button" data-sort="cleanSheets">

      </button>

      <button class="sort-button" data-sort="yellow">
        Yellow
      </button>

      <button class="sort-button" data-sort="red">
        Red
      </button>

      <button class="sort-button" data-sort="mvps">

      </button>

    </div>

    <div class="board-wrap">

      <table class="stat-board">

        <thead>
          <tr>
            <th>PLAYER</th>

          </tr>
        </thead>

        <tbody id="statBoardBody"></tbody>

      </table>

  </section>


  <!-- =========================
       EDIT PLAYER STATS
  ========================== -->

  <section class="section">

    <div class="section-heading">
      <h2>✏️ Edit Player Stats</h2>
    </div>

    <div class="editor-grid" id="editorGrid"></div>

  <!-- =========================
       RANKINGS
  ========================== -->

  <section class="section">

    <div class="section-heading">
      <h2>🏆 Rankings</h2>
    </div>

    <div class="rankings-grid">

      <!-- GOLDEN DEFENCE -->

      <div class="ranking-card">

        <img
          class="trophy"
          src="Screenshot_20260826-003116.png"

          onerror="this.style.display='none'"
        >

        <h2>🛡️ Golden Defence</h2>

        <div id="defenceRanking"></div>

        <button

      </div>


      <!-- BALLON D'OR -->

      <div class="ranking-card">

        <img
          class="trophy"

          alt="Ballon d'Or trophy"
          onerror="this.style.display='none'"
        >

        <h2>🏆 Ballon d'Or</h2>

        <div id="ballonRanking"></div>

        <button

      </div>

  </section>

</div>


<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {
  apiKey: "AIzaSyCyXvJ6IxdE5Nj-J-0YEfipH7CMNZa_RUI",
  authDomain: "recess-soccer.firebaseapp.com",
  databaseURL: "https://recess-soccer-default-rtdb.firebaseio.com",
  projectId: "recess-soccer",
  storageBucket: "recess-soccer.firebasestorage.app",
  messagingSenderId: "872558689342",
  appId: "1:872558689342:web:a4dca17e1d6b963ed6656f",
  measurementId: "G-HJ16JSL5Q2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


/* =========================================
   EDITOR ACCOUNTS
========================================= */

const editors = {

  jack: {
    email: "jmaso12.home@gmail.com",
    name: "Jack"
  },

  jackschool: {
    email: "jack.mason1@stu.ocsb.ca",
    name: "Jack (School)"
  },

  leonardo: {
    email: "leonardo.ljubicic@stu.ocsb.ca",
    name: "Leonardo"
  },

  angelo: {
    email: "angelo.champagne@stu.ocsb.ca",
    name: "Angelo"
  }

};


/* =========================================
   PLAYER NAMES
========================================= */

const PLAYER_NAMES = [
  "Adi",
  "Aidan",
  "Artin",
  "Angelo",
  "Bryson",
  "Cameron",
  "Jack",
  "John",
  "Leonardo",
  "Marc",
  "Matthew",
  "Sami",
  "Nathan",
  "Theo"
];


/* =========================================
   DEFAULT STATS
========================================= */

const DEFAULT_STATS = {
  goals: 0,
  assists: 0,
  saves: 0,
  cleanSheets: 0,
  yellow: 0,
  red: 0,
  mvps: 0
};


const EDITABLE_STATS = [
  {
    key: "goals",
    label: "Goals"
  },
  {
    key: "assists",
    label: "Assists"
  },
  {
    key: "saves",
    label: "Goalie Saves"
  },
  {
    key: "cleanSheets",
    label: "Clean Sheets"
  },
  {
    key: "yellow",
    label: "Yellow Cards"
  },
  {
    key: "red",
    label: "Red Cards"
  },
  {
    key: "mvps",
    label: "MVPs"
  }
];


let playerStats = {};

PLAYER_NAMES.forEach(name => {

  playerStats[name] = {
    ...DEFAULT_STATS
  };

});


/* =========================================
   RANKINGS
========================================= */

let ballonRanking = [...PLAYER_NAMES];
let defenceRanking = [...PLAYER_NAMES];

let currentSort = "default";


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   GET STAT
========================================= */

function getStat(player, stat) {

  const stats =
    playerStats[player] || DEFAULT_STATS;

  if (stat === "ga") {

    return (
      Number(stats.goals || 0) +
      Number(stats.assists || 0)
    );

  }

  return Number(stats[stat] || 0);

}


/* =========================================
   STAT BOARD
========================================= */

function renderStatBoard() {

  const body =
    document.getElementById("statBoardBody");

  let names = [...PLAYER_NAMES];

  if (currentSort !== "default") {

    names.sort((a, b) => {

      const difference =
        getStat(b, currentSort) -
        getStat(a, currentSort);

      if (difference !== 0) {
        return difference;
      }

      return (
        PLAYER_NAMES.indexOf(a) -
        PLAYER_NAMES.indexOf(b)
      );

    });

  }

  body.innerHTML = "";

  names.forEach(name => {

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td class="name">
        ${escapeHTML(name)}
      </td>

      <td>${getStat(name, "goals")}</td>

      <td>${getStat(name, "assists")}</td>

      <td>${getStat(name, "ga")}</td>

      <td>${getStat(name, "saves")}</td>

      <td>${getStat(name, "cleanSheets")}</td>

      <td>${getStat(name, "yellow")}</td>

      <td>${getStat(name, "red")}</td>

      <td>${getStat(name, "mvps")}</td>

    `;

    body.appendChild(row);

  });

}


/* =========================================
   EDIT PLAYER CARDS
========================================= */

function renderEditor() {

  const grid =
    document.getElementById("editorGrid");

  grid.innerHTML = "";

  PLAYER_NAMES.forEach(name => {

    const card =
      document.createElement("div");

    card.className =
      "player-editor";

    let statsHTML = "";

    EDITABLE_STATS.forEach(stat => {

      const value =
        getStat(name, stat.key);

      statsHTML += `

        <div class="edit-stat">

          <span class="edit-stat-label">
            ${stat.label}
          </span>

          <div class="edit-controls">

            <button
              type="button"
              class="edit-button"
              data-player="${escapeHTML(name)}"
              data-stat="${stat.key}"
              data-change="-1"
              aria-label="Remove ${stat.label}"
            >−</button>

            <span class="edit-number">
              ${value}
            </span>

            <button
              type="button"
              class="edit-button"
              data-player="${escapeHTML(name)}"
              data-stat="${stat.key}"
              data-change="1"
              aria-label="Add ${stat.label}"
            >+</button>

          </div>

        </div>

      `;

    });

    card.innerHTML = `
      <h3>${escapeHTML(name)}</h3>
      ${statsHTML}
    `;

    grid.appendChild(card);

  });

}


/* =========================================
   EDIT PLAYER STATS
========================================= */

document
  .getElementById("editorGrid")
  .addEventListener("click", async event => {

    const button =
      event.target.closest(".edit-button");

    if (!button) return;

    if (!auth.currentUser) {

      alert(
        "You must sign in as an editor first."
      );

      return;
    }

    const player =
      button.dataset.player;

    const stat =
      button.dataset.stat;

    const change =
      Number(button.dataset.change);

    if (!playerStats[player]) {

      playerStats[player] = {
        ...DEFAULT_STATS
      };

    }

    const oldValue =
      Number(playerStats[player][stat] || 0);

    const newValue =
      Math.max(
        0,
        oldValue + change
      );

    playerStats[player][stat] =
      newValue;

    /*
      Update both sections immediately.
    */

    renderStatBoard();
    renderEditor();

    try {

      await db
        .ref(
          "players/" +
          player
        )
        .update({
          [stat]: newValue
        });

    } catch (error) {

      console.error(
        "Firebase save error:",
        error
      );

      alert(
        "The stat changed on screen, but Firebase could not save it."
      );

    }

  });


/* =========================================
   LOAD PLAYER STATS
========================================= */

db.ref("players").on(
  "value",
  snapshot => {

    const data =
      snapshot.val() || {};

    PLAYER_NAMES.forEach(name => {

      const saved =
        data[name] || {};

      playerStats[name] = {
        ...DEFAULT_STATS,
        ...saved
      };

    });

    renderStatBoard();
    renderEditor();

  },
  error => {

    console.error(
      "Player Firebase error:",
      error
    );

    renderStatBoard();
    renderEditor();

  }
);


/* =========================================
   SORT BUTTONS
========================================= */

document
  .querySelector(".sort-buttons")
  .addEventListener("click", event => {

    const button =
      event.target.closest(".sort-button");

    if (!button) return;

    currentSort =
      button.dataset.sort;

    document
      .querySelectorAll(".sort-button")
      .forEach(btn => {
        btn.classList.remove("active");
      });

    button.classList.add("active");

    renderStatBoard();

  });


/* =========================================
   NORMALIZE RANKING
========================================= */

function normalizeRanking(saved) {

  const result = [];

  if (Array.isArray(saved)) {

    saved.forEach(name => {

      if (
        PLAYER_NAMES.includes(name) &&
        !result.includes(name)
      ) {

        result.push(name);

      }

    });

  }

  PLAYER_NAMES.forEach(name => {

    if (!result.includes(name)) {
      result.push(name);
    }

  });

  return result;

}


/* =========================================
   BALLON D'OR
========================================= */

function renderBallonRanking() {

  const container =
    document.getElementById("ballonRanking");

  container.innerHTML = "";

  ballonRanking.forEach(
    (name, index) => {

      const row =
        document.createElement("div");

      row.className =
        "ranking-row";

      row.innerHTML = `

        <span class="rank-number">
          ${index + 1}
        </span>

        <span class="rank-name">
          ${escapeHTML(name)}
        </span>

        <div class="rank-controls">

          <button
            type="button"
            class="rank-button"
            data-ranking="ballon"
            data-index="${index}"
            data-direction="-1"
            ${index === 0 ? "disabled" : ""}
          >↑</button>

          <button
            type="button"
            class="rank-button"
            data-ranking="ballon"
            data-index="${index}"
            data-direction="1"
            ${index === ballonRanking.length - 1 ? "disabled" : ""}
          >↓</button>

        </div>

      `;

      container.appendChild(row);

    }
  );

}


/* =========================================
   GOLDEN DEFENCE
==========================
