const statsRef = db.ref("players");
const rankingsRef = db.ref("rankings");


/* =========================================================
   PLAYER NAMES
   THESE ARE ALWAYS DISPLAYED

const playerNames = [

/* =========================================================

========================================================= */

function defaultPlayer() {
    return {
        goals: 0,
        assists: 0,
        saves: 0,
        mvp: 0,
        cleanSheets: 0,
        yellow: 0,
        red: 0
    };
}


/* =========================================================
   LOCAL PLAYER DATA
========================================================= */

let players = {};

playerNames.forEach(function(name) {
    players[name] = defaultPlayer();
});


/* =========================================================
   EDITOR ACCOUNTS
========================================================= */

const editorEmails = {

    "jack.mason1@stu.ocsb.ca": "Jack (School)",
    "leonardo.ljubicic@stu.ocsb.ca": "Leonardo",
    "angelo.champagne@stu.ocsb.ca": "Angelo"
};

let isEditor = false;
let currentUserName = null;


/* =========================================================
   SORT
========================================================= */

let currentSort = "ga";


function setSort(stat) {

    currentSort = stat;

    const dropdown = document.getElementById("leaderboardSort");

    if (dropdown) {
        dropdown.value = stat;
    }

    document.querySelectorAll(".top-bar button").forEach(function(button) {
        button.classList.remove("active");
    });

    const ids = {
        ga: "sortGA",
        goals: "sortGoals",
        assists: "sortAssists",
        saves: "sortSaves",
        mvp: "sortMVP",
        cleanSheets: "sortClean",
        yellow: "sortYellow",
        red: "sortRed"
    };

    if (ids[stat]) {
        const button = document.getElementById(ids[stat]);

        if (button) {
            button.classList.add("active");
        }
    }

    renderLeaderboard();
}


/* =========================================================
   GET STAT VALUE
========================================================= */

function getStatValue(player, stat) {

    if (!player) {
        return 0;
    }

    if (stat === "ga") {
        return Number(player.goals || 0) +
               Number(player.assists || 0);
    }

    return Number(player[stat] || 0);
}


/* =========================================================
   CHANGE STAT
   THIS IS THE IMPORTANT PART:
   THE PLAYER NAME IS PASSED DIRECTLY INTO THIS FUNCTION.
========================================================= */

function changeStat(playerName, stat, amount) {

    /* Make sure the player exists */
    if (!players[playerName]) {
        players[playerName] = defaultPlayer();
    }

    /* Make sure the stat exists */
    if (typeof players[playerName][stat] !== "number") {
        players[playerName][stat] = 0;
    }

    /* Calculate new value */
    let newValue =
        Number(players[playerName][stat]) + Number(amount);

    /* Never allow a stat below zero */
    if (newValue < 0) {
        newValue = 0;
    }

    /* Update the exact player's local data */
    players[playerName][stat] = newValue;

    /*
       IMPORTANT:
       We do NOT sort or reorder the player cards here.
       The player cards always use playerNames order.
    */

    renderPlayers();
    renderLeaderboard();

    /* Only editors should try to save */
    if (!isEditor) {
        return;
    }

    /*
       Save only this player's stat.
       This prevents changing one player from overwriting
       everyone else's stats.
    */

    const update = {};
    update[stat] = newValue;

    statsRef
        .child(playerName)
        .update(update)
        .then(function() {

            document.getElementById("statusBar").textContent =
                "Live • " + playerName + " " + stat + " updated";

        })
        .catch(function(error) {

            console.error("Firebase save error:", error);

            document.getElementById("statusBar").textContent =
                "Firebase save error: " + error.message;
        });
}


/* =========================================================
   LOAD PLAYER DATA FROM FIREBASE
========================================================= */

statsRef.on("value", function(snapshot) {

    const firebasePlayers = snapshot.val() || {};

    /*
       Start with all 14 names.
       This guarantees that missing Firebase players
       still appear on the page.
    */

    playerNames.forEach(function(name) {

        const firebasePlayer = firebasePlayers[name];

        if (firebasePlayer) {

            players[name] = {
                goals: Number(firebasePlayer.goals || 0),
                assists: Number(firebasePlayer.assists || 0),
                saves: Number(firebasePlayer.saves || 0),
                mvp: Number(firebasePlayer.mvp || 0),
                cleanSheets: Number(firebasePlayer.cleanSheets || 0),
                yellow: Number(firebasePlayer.yellow || 0),
                red: Number(firebasePlayer.red || 0)
            };

        } else {

            /*
               If Firebase doesn't have the player yet,
               create them locally as zeroes.
            */

            players[name] = defaultPlayer();
        }
    });

    renderPlayers();
    renderLeaderboard();

    document.getElementById("statusBar").textContent =
        "Live • Firebase connected";

}, function(error) {

    console.error("Firebase read error:", error);

    /*
       Even if Firebase fails,
       the names still render.
    */

    renderPlayers();
    renderLeaderboard();

    document.getElementById("statusBar").textContent =
        "Firebase connection error — showing local player list";
});


/* =========================================================
   RENDER PLAYER CARDS
   ALWAYS USES playerNames
   SO EDITING DOES NOT MOVE PLAYERS AROUND
========================================================= */

function renderPlayers() {

    const container = document.getElementById("players");

    if (!container) {
        return;
    }

    let html = "";

    playerNames.forEach(function(name) {

        const p = players[name] || defaultPlayer();

        html += `
            <div class="player-card">

                <div class="player-name">
                    ${escapeHTML(name)}
                </div>

                ${statHTML(name, "goals", "Goals", p.goals)}
                ${statHTML(name, "assists", "Assists", p.assists)}
                ${statHTML(name, "saves", "Goalie Saves", p.saves)}
                ${statHTML(name, "mvp", "MVPs", p.mvp)}
                ${statHTML(name, "cleanSheets", "Clean Sheets", p.cleanSheets)}
                ${statHTML(name, "yellow", "Yellow Cards", p.yellow)}
                ${statHTML(name, "red", "Red Cards", p.red)}

                <div class="stat-row">
                    <div class="stat-name">
                        Goals + Assists
                    </div>

                    <div class="stat-value">
                        ${Number(p.goals || 0) + Number(p.assists || 0)}
                    </div>
                </div>

            </div>
        `;
    });

    container.innerHTML = html;
}


/* =========================================================
   STAT HTML
========================================================= */

function statHTML(playerName, stat, label, value) {

    value = Number(value || 0);

    let buttons = "";

    if (isEditor) {

        buttons = `
            <button
                class="stat-button minus"
                onclick="changeStat('${safeJS(playerName)}', '${stat}', -1)"
            >−</button>

            <div class="stat-value">
                ${value}
            </div>

            <button
                class="stat-button"
                onclick="changeStat('${safeJS(playerName)}', '${stat}', 1)"
            >+</button>
        `;

    } else {

        buttons = `
            <div class="stat-value">
                ${value}
            </div>
        `;
    }

    return `
        <div class="stat-row">

            <div class="stat-name">
                ${label}
            </div>

            ${buttons}

        </div>
    `;
}


/* =========================================================
   LEADERBOARD
   ONLY THE LEADERBOARD IS SORTED
   PLAYER CARDS ARE NOT SORTED
========================================================= */

function renderLeaderboard() {

    const container = document.getElementById("leaderboard");

    if (!container) {
        return;
    }

    const list = playerNames.map(function(name) {

        return {
            name: name,
            value: getStatValue(players[name], currentSort)
        };

    });

    list.sort(function(a, b) {

        if (b.value !== a.value) {
            return b.value - a.value;
        }

        /*
           If tied, keep original player order.
        */

        return playerNames.indexOf(a.name) -
               playerNames.indexOf(b.name);
    });

    let html = "";

    list.forEach(function(player, index) {

        html += `
            <div class="leader-row">

                <div class="leader-rank">
                    #${index + 1}
                </div>

                <div class="leader-player">
                    ${escapeHTML(player.name)}
                </div>

                <div class="leader-score">
                    ${player.value}
                </div>

            </div>
        `;
    });

    container.innerHTML = html;
}

========================================================= */

let defenceRanking = [...playerNames];


/* =========================================================
   LOAD RANKINGS
========================================================= */

rankingsRef.on("value", function(snapshot) {

    const data = snapshot.val();

    if (data) {

        if (Array.isArray(data.ballon)) {

            ballonRanking = cleanRanking(data.ballon);
        }

        if (Array.isArray(data.defence)) {

            defenceRanking = cleanRanking(data.defence);
