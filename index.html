<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saint Matthews Recess Soccer Live Stats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --green: #19c37d;
  --green-dark: #087f52;
  --blue: #28a9ff;
  --dark: #07131d;
  --card: rgba(11, 29, 39, 0.86);
  --border: rgba(255,255,255,0.10);
  --text: #f5f8fa;
  --muted: #9eb0bb;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  min-height: 100vh;

  background:
    radial-gradient(circle at 10% 10%, rgba(25,195,125,.18), transparent 28%),
    radial-gradient(circle at 90% 20%, rgba(40,169,255,.14), transparent 30%),
    linear-gradient(135deg, #041018, #071a20 50%, #041017);
}

/* Soccer-field style background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .12;
  background:
    linear-gradient(90deg, transparent 49.7%, white 49.7%, white 50.3%, transparent 50.3%),
    radial-gradient(circle at center, transparent 10%, white 10.3%, transparent 10.7%);
}

header {
  text-align: center;
  padding: 30px 15px 20px;
}

.logo {
  font-size: 48px;
  margin-bottom: 5px;
}

h1 {
  margin: 0;
  font-size: clamp(26px, 6vw, 46px);
  font-weight: 900;
}

.subtitle {
  color: var(--muted);
  margin-top: 8px;
  font-size: 15px;
}

.container {
  width: min(1200px, 94%);
  margin: auto;
}

/* LOGIN */
.login-card {
  max-width: 430px;
  margin: 20px auto;
  padding: 22px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(15px);
  box-shadow: 0 15px 50px rgba(0,0,0,.30);
}

.login-card h2 {
  margin-top: 0;
  text-align: center;
}

select,
input {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #10232e;
  color: white;
  font-size: 15px;
}

button {
  border: 0;
  cursor: pointer;
  border-radius: 10px;
  font-weight: bold;
}

.login-btn {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  background: var(--green);
  color: #03130d;
}

.logout-btn {
  padding: 9px 14px;
  background: #243945;
  color: white;
}

.status {
  text-align: center;
  font-size: 13px;
  margin-top: 10px;
  color: var(--muted);
}

.firebase-status {
  text-align: center;
  margin: 12px auto;
  padding: 9px 14px;
  width: fit-content;
  max-width: 95%;
  border-radius: 999px;
  background: rgba(255,255,255,.06);
  color: #cbd7dc;
  font-size: 13px;
}

.firebase-status.connected {
  color: #72f2b5;
  background: rgba(25,195,125,.10);
}

.firebase-status.error {
  color: #ff8e8e;
  background: rgba(255,60,60,.10);
}

/* CONTROLS */
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 25px 0;
}

.controls select {
  width: auto;
  min-width: 180px;
}

/* PLAYERS */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  margin-bottom: 40px;
}

.player-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  backdrop-filter: blur(14px);
  box-shadow: 0 12px 35px rgba(0,0,0,.22);
  transition: transform .2s, border-color .2s;
}

.player-card:hover {
  transform: translateY(-3px);
  border-color: rgba(25,195,125,.35);
}

.player-name {
  font-size: 23px;
  font-weight: 900;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-number {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--green), var(--blue));
  color: #00150e;
  font-size: 14px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.stat-row:last-child {
  border-bottom: 0;
}

.stat-label {
  color: #c7d3d8;
  font-size: 14px;
}

.stat-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}

.stat-value {
  min-width: 30px;
  text-align: center;
  font-weight: 900;
  font-size: 17px;
}

.stat-btn {
  width: 29px;
  height: 29px;
  background: #18333e;
  color: white;
  font-size: 18px;
}

.stat-btn:hover {
  background: var(--green-dark);
}

.stat-btn:disabled {
  opacity: .25;
  cursor: not-allowed;
}

/* RANKINGS */
.section {
  margin: 45px 0;
}

.section-title {
  text-align: center;
  font-size: 30px;
  margin-bottom: 18px;
}

.trophy {
  display: block;
  width: 80px;
  height: 80px;
  object-fit: contain;
  margin: 0 auto 10px;
  border-radius: 12px;
}

.ranking-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 10px;
  margin-bottom: 12px;
}

.rank-row {
  display: grid;
  grid-template-columns: 45px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.rank-row:last-child {
  border-bottom: 0;
}

.rank-number {
  font-size: 18px;
  font-weight: 900;
}

.movement {
  display: flex;
  gap: 5px;
}

.move-btn {
  width: 30px;
  height: 30px;
  background: #18333e;
  color: white;
}

.save-ranking {
  display: block;
  margin: 14px auto 5px;
  padding: 11px 20px;
  background: var(--green);
  color: #00150e;
}

.hidden {
  display: none !important;
}

.viewer-note {
  text-align: center;
  color: var(--muted);
  margin: 15px 0;
  font-size: 13px;
}

@media (max-width: 600px) {
  .players-grid {
    grid-template-columns: 1fr;
  }

  .controls {
    flex-direction: column;
  }

  .controls select {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">⚽</div>
  <h1>Saint Matthews Recess Soccer</h1>
  <div class="subtitle">Live Stats • Rankings • MVPs</div>
</header>

<div class="container">

  <div id="firebaseStatus" class="firebase-status">
    Connecting to Firebase...
  </div>

  <!-- LOGIN -->
  <div class="login-card">
    <h2>Editor Login</h2>

    <select id="usernameSelect">
      <option value="">Select editor username</option>
      <option value="jack">jack</option>
      <option value="jackschool">jackschool</option>
      <option value="leonardo">leonardo</option>
      <option value="angelo">angelo</option>
    </select>

    <input
      id="passwordInput"
      type="password"
      placeholder="Enter PIN / password"
      autocomplete="current-password"
    >

    <button class="login-btn" id="loginButton">

    </button>

    <div id="loginStatus" class="status">

  <div class="controls">
    <select id="sortSelect">
      <option value="original">Player Order</option>
      <option value="goals">Sort by Goals</option>
      <option value="assists">Sort by Assists</option>
      <option value="ga">Sort by G+A</option>
      <option value="saves">Sort by Goalie Saves</option>
      <option value="cleanSheets">Sort by Clean Sheets</option>
      <option value="mvps">Sort by MVPs</option>
  </select>

  <button
    id="logoutButton"
    class="logout-btn hidden"
  >
    Sign Out
  </button>
</div>

<div class="viewer-note">
  Stats update live for everyone viewing the website.
</div>

<!-- PLAYER CARDS -->
<div id="playersGrid" class="players-grid"></div>

<!-- GOLDEN DEFENCE -->
<section class="section">
  <img
    class="trophy"
    src="Screenshot_20260826-003116.png"
    alt="Golden Defence trophy"
  >

  <h2 class="section-title">Golden Defence</h2>

  <div id="defenceRanking" class="ranking-card"></div>

  <button
    id="saveDefence"
    class="save-ranking hidden"
  >
    Save Golden Defence
  </button>
</section>

<!-- BALLON D'OR -->
<section class="section">
  <img
    class="trophy"
    src="Screenshot_20260826-003131.png"
    alt="Ballon d'Or trophy"
  >

  <h2 class="section-title">Ballon d'Or</h2>

  <div id="ballonRanking" class="ranking-card"></div>

  <button
    id="saveBallon"
    class="save-ranking hidden"
  >
    Save Ballon d'Or
  </button>
</section>

<script>
/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyCyXvJ6kIxdE5Nj-J0YEfipH7CMNZa_RUI",
  authDomain: "recess-soccer.firebaseapp.com",
  databaseURL: "https://recess-soccer-default-rtdb.firebaseio.com",
  projectId: "recess-soccer",
  storageBucket: "recess-soccer.firebasestorage.app",
  messagingSenderId: "872558689342",
  appId: "1:872558689342:web:a4dca17e1d6b963ed6656f",
  measurementId: "G-HJ16JSL5Q2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const statsRef = db.ref("players");
const rankingsRef = db.ref("rankings");


/* =========================================================
   IMPORTANT:
   THESE NAMES ARE ALWAYS SHOWN.
   THEY DO NOT COME FROM FIREBASE.
========================================================= */

const PLAYER_NAMES = [
  "Adi",
  "Aidan",
  "Artin",
  "Angelo",
  "Bryson",
  "Cameron",
  "Jack",
  "John",
  "Leonardo",
  "Marc",
  "Matthew",
  "Sami",
  "Nathan",
  "Theo"
];


/* =========================================================
   EDITOR ACCOUNTS
========================================================= */

const EDITORS = {
  jack: {
    email: "jmaso12.home@gmail.com",
    name: "Jack"
  },

  jackschool: {
    email: "jack.mason1@stu.ocsb.ca",
    name: "Jack (School)"
  },

  leonardo: {
    email: "leonardo.ljubicic@stu.ocsb.ca",
    name: "Leonardo"
  },

  angelo: {
    email: "angelo.champagne@stu.ocsb.ca",
    name: "Angelo"
  }
};


/* =========================================================
   DEFAULT PLAYER STATS
========================================================= */

const DEFAULT_STATS = {
  goals: 0,
  assists: 0,
  saves: 0,
  cleanSheets: 0,
  yellowCards: 0,
  redCards: 0,
  mvps: 0
};


/* =========================================================
   LOCAL STATE
========================================================= */

let players = {};
let isEditor = false;
let currentEditor = null;

let defenceRanking = [...PLAYER_NAMES];
let ballonRanking = [...PLAYER_NAMES];


/* =========================================================
   CREATE ALL PLAYERS IMMEDIATELY
   THIS FIXES THE NAME PROBLEM
========================================================= */

function initializePlayers() {

  PLAYER_NAMES.forEach(name => {

    players[name] = {
      ...DEFAULT_STATS
    };

  });

}


/* =========================================================
   FIREBASE STATUS
========================================================= */

function setFirebaseStatus(message, type = "") {

  const element = document.getElementById("firebaseStatus");

  element.textContent = message;

  element.className = "firebase-status";

  if (type) {
    element.classList.add(type);
  }
}


/* =========================================================
   RENDER PLAYERS
========================================================= */

function renderPlayers() {

  const grid = document.getElementById("playersGrid");

  grid.innerHTML = "";

  let names = [...PLAYER_NAMES];

  const sortType = document.getElementById("sortSelect").value;

  if (sortType !== "original") {

    names.sort((a, b) => {

      const A = players[a];
      const B = players[b];

      let aValue = 0;
      let bValue = 0;

      if (sortType === "goals") {
        aValue = A.goals;
        bValue = B.goals;
      }

      if (sortType === "assists") {
        aValue = A.assists;
        bValue = B.assists;
      }

      if (sortType === "ga") {
        aValue = A.goals + A.assists;
        bValue = B.goals + B.assists;
      }

      if (sortType === "saves") {
        aValue = A.saves;
        bValue = B.saves;
      }

      if (sortType === "cleanSheets") {
        aValue = A.cleanSheets;
        bValue = B.cleanSheets;
      }

      if (sortType === "mvps") {
        aValue = A.mvps;
        bValue = B.mvps;
      }

      return bValue - aValue;
    });
  }


  names.forEach((name, index) => {

    const stats = players[name];

    const card = document.createElement("div");

    card.className = "player-card";

    card.innerHTML = `
      <div class="player-name">
        <span class="player-number">${index + 1}</span>
        <span>${escapeHTML(name)}</span>
      </div>

      ${createStatRow(name, "goals", "Goals", stats.goals)}
      ${createStatRow(name, "assists", "Assists", stats.assists)}

      <div class="stat-row">
        <span class="stat-label">G+A</span>
        <div class="stat-controls">
          <span class="stat-value">${stats.goals + stats.assists}</span>
        </div>
      </div>

      ${createStatRow(name, "saves", "Goalie Saves", stats.saves)}
      ${createStatRow(name, "cleanSheets", "Clean Sheets", stats.cleanSheets)}
      ${createStatRow(name, "yellowCards", "Yellow Cards", stats.yellowCards)}
      ${createStatRow(name, "redCards", "Red Cards", stats.redCards)}
      ${createStatRow(name, "mvps", "MVPs", stats.mvps)}
    `;

    grid.appendChild(card);
  });

}


/* =========================================================
   STAT ROW
   ALL STATS ARE VISIBLE
========================================================= */

function createStatRow(playerName, stat, label, value) {

  const disabled = isEditor ? "" : "disabled";

  return `
    <div class="stat-row">

      <span class="stat-label">
        ${label}
      </span>

      <div class="stat-controls">

        <button
          class="stat-btn"
          ${disabled}
          onclick="changeStat('${escapeAttribute(playerName)}','${stat}',-1)"
        >
          −
        </button>

        <span class="stat-value">
          ${value}
        </span>

        <button
          class="stat-btn"
          ${disabled}
          onclick="changeStat('${escapeAttribute(playerName)}','${stat}',1)"
        >
          +
        </button>

      </div>

    </div>
  `;
}


/* =========================================================
   CHANGE STAT
========================================================= */

window.changeStat = async function(playerName, stat, amount) {

  if (!isEditor) {
    return;
  }

  if (!players[playerName]) {
    console.error("Player does not exist:", playerName);
    return;
  }

  const oldValue = Number(players[playerName][stat]) || 0;

  const newValue = Math.max(
    0,
    oldValue + amount
  );

  players[playerName][stat] = newValue;

  renderPlayers();

  try {

    await statsRef
      .child(playerName)
      .update({
        [stat]: newValue
      });

    setFirebaseStatus(
      "Firebase connected • Stats saved",
      "connected"
    );

  } catch (error) {

    console.error("Firebase save error:", error);

    players[playerName][stat] = oldValue;

    renderPlayers();

    setFirebaseStatus(
      "Firebase could not save: " + error.code,
      "error"
    );
  }

};


/* =========================================================
   LOAD STATS FROM FIREBASE
========================================================= */

statsRef.on(
  "value",

  snapshot => {

    const data = snapshot.val() || {};

    /*
      IMPORTANT:
      Start with ALL hardcoded names,
      then merge Firebase data into them.
    */

    PLAYER_NAMES.forEach(name => {

      players[name] = {
        ...DEFAULT_STATS,
        ...(data[name] || {})
      };

    });

    renderPlayers();

    setFirebaseStatus(
      "Firebase connected • Live stats active",
      "connected"
    );

  },

  error => {

    console.error("Firebase read error:", error);

    /*
      Even if Firebase fails,
      the player names STILL remain visible.
    */

    renderPlayers();

    setFirebaseStatus(
      "Firebase connection problem: " + error.code,
      "error"
    );

  }
);


/* =========================================================
   LOGIN
========================================================= */

document.getElementById("loginButton").addEventListener(
  "click",
  async () => {

    const username =
      document.getElementById("usernameSelect").value;

    const password =
      document.getElementById("passwordInput").value;

    const status =
      document.getElementById("loginStatus");

    if (!username) {

      status.textContent =
        "Please select your username.";

      return;
    }

    if (!password) {

      status.textContent =
        "Please enter your PIN/password.";

      return;
    }

    const account = EDITORS[username];

    if (!account) {

      status.textContent =
        "Invalid editor.";

      return;
    }

    status.textContent =
      "Signing in...";

    try {

      await auth.signInWithEmailAndPassword(
        account.email,
        password
      );

    } catch (error) {

      console.error(error);

      status.textContent =
        "Login failed: " + error.code;

    }

  }
);


/* =========================================================
   AUTH STATE
========================================================= */

auth.onAuthStateChanged(user => {

  if (user) {

    const foundEditor =
      Object.entries(EDITORS).find(
        ([username, account]) =>
          account.email.toLowerCase() ===
          user.email.toLowerCase()
      );

    if (foundEditor) {

      currentEditor = foundEditor[0];
      isEditor = true;

      document.getElementById("loginStatus").textContent =
        "Signed in as " +
        EDITORS[currentEditor].name +
        " • Editing enabled";

      document.getElementById("logoutButton")
        .classList.remove("hidden");

      document.getElementById("saveDefence")
        .classList.remove("hidden");

      document.getElementById("saveBallon")
        .classList.remove("hidden");

    } else {

      isEditor = false;

      document.getElementById("loginStatus").textContent =
        "Account authenticated, but it is not an editor.";

    }

  } else {

    isEditor = false;
    currentEditor = null;

    document.getElementById("loginStatus").textContent =
      "Viewer mode — stats are view only.";

    document.getElementById("logoutButton")
      .classList.add("hidden");

    document.getElementById("saveDefence")
      .classList.add("hidden");

    document.getElementById("saveBallon")
      .classList.add("hidden");
  }

  renderPlayers();

});


/* =========================================================
   LOGOUT
========================================================= */

document.getElementById("logoutButton")
  .addEventListener("click", async () => {

    await auth.signOut();

  });


/* =========================================================
   SORTING
========================================================= */

document.getElementById("sortSelect")
  .addEventListener("change", renderPlayers);


/* =========================================================
   RANKINGS
========================================================= */

function renderRanking(containerId, ranking) {

  const container =
    document.getElementById(containerId);

  container.innerHTML = "";

  ranking.forEach((name, index) => {

    const row = document.createElement("div");

    row.className = "rank-row";

    row.innerHTML = `
      <span class="rank-number">
        ${index + 1}
      </span>

      <strong>
        ${escapeHTML(name)}
      </strong>

      ${
        isEditor
        ?
        `
        <div class="movement">

          <button
            class="move-btn"
            onclick="moveRanking('${containerId}',${index},-1)"
          >
            ↑
          </button>

          <button
            class="move-btn"
            onclick="moveRanking('${conta
