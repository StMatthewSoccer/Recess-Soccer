/* =========================================================

const playerNames = [

};

let isEditor = false;


/* =========================================================
   RENDER PLAYERS
========================================================= */

function renderPlayers() {

    const container = document.getElementById("players");

    let html = "";

    /*
       IMPORTANT:
       This always loops through playerNames.
       Firebase is NOT needed for names to appear.
    */

    playerNames.forEach(function(name) {

        const p = players[name];

        html += `

            <div class="player">

                <h3>${name}</h3>

                ${makeStat(name, "goals", "Goals")}
                ${makeStat(name, "assists", "Assists")}
                ${makeStat(name, "saves", "Goalie Saves")}
                ${makeStat(name, "mvp", "MVPs")}
                ${makeStat(name, "cleanSheets", "Clean Sheets")}
                ${makeStat(name, "yellow", "Yellow Cards")}
                ${makeStat(name, "red", "Red Cards")}

                <div class="ga">

                    <span>Goals + Assists</span>

                    <span>
                        ${Number(p.goals) + Number(p.assists)}
                    </span>

                </div>

            </div>

        `;
    });

    container.innerHTML = html;
}


/* =========================================================
   MAKE STAT ROW
========================================================= */

function makeStat(playerName, stat, label) {

    const value = Number(players[playerName][stat] || 0);

    if (isEditor) {

        return `

            <div class="stat">

                <div class="stat-name">
                    ${label}
                </div>

                <button
                    class="minus"
                    onclick="changeStat('${playerName}', '${stat}', -1)"
                >
                    −
                </button>

                <div class="stat-value">
                    ${value}
                </div>

                <button
                    onclick="changeStat('${playerName}', '${stat}', 1)"
                >
                    +
                </button>

            </div>

        `;

    } else {

        return `

            <div class="stat">

                <div class="stat-name">
                    ${label}
                </div>

                <div></div>

                <div class="stat-value">
                    ${value}
                </div>

                <div></div>

            </div>

        `;
    }
}


/* =========================================================
   CHANGE STAT BY PLAYER NAME
========================================================= */

function changeStat(playerName, stat, amount) {

    /*
       Make absolutely sure the requested player exists.
    */

    if (!players[playerName]) {
        console.error("Player not found:", playerName);
        return;
    }

    /*
       Get the current value.
    */

    let current =
        Number(players[playerName][stat] || 0);

    /*
       Add or subtract.
    */

    let newValue = current + Number(amount);

    /*
       Don't allow negative stats.
    */

    if (newValue < 0) {
        newValue = 0;
    }

    /*
       Update ONLY that player's stat.
    */

    players[playerName][stat] = newValue;

    /*
       Update the screen immediately.
    */

    renderPlayers();
    renderLeaderboard();

    /*
       Save to Firebase if logged in as an editor.
    */

    if (isEditor) {

        playersRef
            .child(playerName)
            .child(stat)
            .set(newValue)

            .then(function() {

                document.getElementById("status").textContent =
                    "Live • " +
                    playerName +
                    " " +
                    stat +
                    " = " +
                    newValue;

            })

            .catch(function(error) {

                console.error("Firebase error:", error);

                document.getElementById("status").textContent =
                    "Could not save: " + error.message;

            });
    }
}


/* =========================================================
   FIREBASE LOAD
========================================================= */

playersRef.on("value", function(snapshot) {

    const data = snapshot.val();

    /*
       Load Firebase stats into the correct player.
    */

    if (data) {

        playerNames.forEach(function(name) {

            if (data[name]) {

                players[name].goals =
                    Number(data[name].goals || 0);

                players[name].assists =
                    Number(data[name].assists || 0);

                players[name].saves =
                    Number(data[name].saves || 0);

                players[name].mvp =
                    Number(data[name].mvp || 0);

                players[name].cleanSheets =
                    Number(data[name].cleanSheets || 0);

                players[name].yellow =
                    Number(data[name].yellow || 0);

                players[name].red =
                    Number(data[name].red || 0);

            }

        });

    }

    renderPlayers();
    renderLeaderboard();

    document.getElementById("status").textContent =
        "Live • Firebase connected";

}, function(error) {

    console.error(error);

    /*
       Even if Firebase has a problem,
       the 14 names still appear.
    */

    renderPlayers();
    renderLeaderboard();

    document.getElementById("status").textContent =
        "Firebase error • Player list still loaded";
});


/* =========================================================
   LEADERBOARD
========================================================= */

let currentLeaderboardSort = "ga";


function sortLeaderboard(stat) {

    currentLeaderboardSort = stat;

    renderLeaderboard();
}


function getLeaderboardValue(player, stat) {

    if (stat === "ga") {

        return Number(player.goals || 0) +
               Number(player.assists || 0);

    }

    return Number(player[stat] || 0);
}


function renderLeaderboard() {

    const container =
        document.getElementById("leaderboard");

    const list = playerNames.map(function(name, index) {

        return {
            name: name,
            value: getLeaderboardValue(
                players[name],
                currentLeaderboardSort
            ),
            originalIndex: index
        };

    });

    /*
       Sort leaderboard only.
       Player cards remain in their normal order.
    */

    list.sort(function(a, b) {

        if (b.value !== a.value) {
            return b.value - a.value;
        }

        return a.originalIndex - b.originalIndex;

    });

    let html = "";

    list.forEach(function(item, index) {

        html += `

            <div class="leader">

                <div class="rank">
                    #${index + 1}
                </div>

                <div>
                    ${item.name}
                </div>

                <div class="score">
                    ${item.value}
                </div>

            </div>

        `;

    });

    container.innerHTML = html;
}


/* =========================================================
   RANKINGS
========================================================= */

let ballonRanking = [...playerNames];
let defenceRanking = [...playerNames];


/* =========================================================
   LOAD RANKINGS
========================================================= */

rankingsRef.on("value", function(snapshot) {

    const data = snapshot.val();

    if (data) {

        if (Array.isArray(data.ballon)) {
            ballonRanking =
                cleanRanking(data.ballon);
        }

        if (Array.isArray(data.defence)) {
            defenceRanking =
                cleanRanking(data.defence);
        }
    }

    renderRankings();
});


function cleanRanking(list) {

    const result = [];

    list.forEach(function(name) {

        if (
            playerNames.includes(name) &&
            !result.includes(name)
        ) {
            result.push(name);
        }

    });

    playerNames.forEach(function(name) {

        if (!result.includes(name)) {
            result.push(name);
        }

    });

    return result;
}


/* =========================================================
   RENDER RANKINGS
========================================================= */

function renderRankings() {

    renderRanking(
        "ballonRanking",
        ballonRanking,
        "ballon"
    );

    renderRanking(
        "defenceRanking",
        defenceRanking,
        "defence"
    );
}


function renderRanking(elementID, ranking, type) {

    const container =
        document.getElementById(elementID);

    let html = "";

    ranking.forEach(function(name, index) {

        html += `

            <div class="ranking-row">

                <div>
                    #${index + 1}
                </div>

                <div>
                    ${name}
                </div>

                ${
                    isEditor && index > 0
                    ?
                    `
                    <button
                        class="move"
                        onclick="moveRanking('${type}', ${index}, -1)"
                    >
                        ↑
                    </button>
                    `
                    :
                    `<div></div>`
                }

                ${
                    isEditor && index < ranking.length - 1
                    ?
                    `
                    <button
                        class="move"
                        onclick="moveRanking('${type}', ${index}, 1)"
                    >
                        ↓
                    </button>
                    `
                    :
                    `<div></div>`
                }

            </div>

        `;

    });

    container.innerHTML = html;
}


/* =========================================================
   MOVE RANKING
========================================================= */

function moveRanking(type, index, direction) {

    if (!isEditor) {
        return;
    }

    const ranking =
        type === "ballon"
        ? ballonRanking
        : defenceRanking;

    const newIndex = index + direction;

    if (
        newIndex < 0 ||
        newIndex >= ranking.length
    ) {
        return;
    }

    const temp = ranking[index];

    ranking[index] = ranking[newIndex];
    ranking[newIndex] = temp;

    renderRankings();
}

        document.getElementById("loginBox");

    if (box.style.display === "block") {
        box.style.display = "none";
    } else {
        box.style.display = "block";
    }
}

    if (!email || !password) {
