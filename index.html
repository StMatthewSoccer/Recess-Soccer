<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Recess Soccer Live Stats</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#fff}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#087a4b,#123b72)}
h1{margin:0 0 6px;font-size:30px}.subtitle{opacity:.9}.status{margin-top:9px;font-size:14px}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;padding:15px}
button{border:0;border-radius:12px;padding:10px 15px;font-size:16px;font-weight:700;cursor:pointer}
.reset{background:#e74c3c;color:#fff}.sort{background:#fff;color:#111}
.section{max-width:1100px;margin:0 auto 20px;padding:0 12px}
.section h2{text-align:center;margin:18px 0 12px;font-size:26px}
.rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.rank-card,.leader-card{background:#151f31;border:1px solid #29364d;border-radius:18px;padding:16px}
.rank-card h3{margin:0 0 12px;text-align:center;font-size:22px}
.rank-row{display:grid;grid-template-columns:38px 1fr 42px 42px;align-items:center;gap:8px;margin:8px 0;padding:8px;border-radius:12px;background:#1d293d}
.rank-number{text-align:center;font-size:20px;font-weight:900}
.rank-name{font-size:18px;font-weight:700}
.move{width:42px;height:38px;padding:0;font-size:19px;background:#33465f;color:#fff}
.move:disabled{opacity:.3;cursor:not-allowed}
.award-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.award-row{display:grid;grid-template-columns:1fr 44px 55px 44px;align-items:center;gap:6px;background:#151f31;border:1px solid #29364d;border-radius:15px;padding:10px}
.award-name{font-weight:700;font-size:17px}.award-value{text-align:center;font-size:21px;font-weight:900}
.plus,.minus{width:44px;height:40px;padding:0;font-size:22px}.plus{background:#16a085;color:#fff}.minus{background:#c0392b;color:#fff}
.grid{max-width:1100px;margin:auto;padding:0 12px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:#151f31;border:1px solid #29364d;border-radius:18px;padding:18px}.player{font-size:23px;font-weight:800;margin-bottom:14px}
.stat{display:grid;grid-template-columns:1fr 48px 48px 48px;align-items:center;gap:7px;margin:9px 0}
.value{text-align:center;font-size:20px;font-weight:800}.total{margin-top:13px;padding-top:12px;border-top:1px solid #334158;font-weight:800;font-size:18px}
table{width:100%;border-collapse:collapse;background:#151f31;border-radius:15px;overflow:hidden}
th,td{padding:10px;text-align:center;border-bottom:1px solid #29364d}th{background:#1e2c43}
@media(max-width:500px){h1{font-size:25px}.rank-row{grid-template-columns:34px 1fr 40px 40px}.award-row{grid-template-columns:1fr 40px 50px 40px}}
</style></head><body>
<header><h1>⚽ Recess Soccer Live Stats</h1><div class="subtitle">Everyone sees the same score in real time</div><div class="status" id="status">Connecting…</div></header>

<div class="controls">
<button class="sort" onclick="sortBy('ga')">Sort: G+A</button>
<button class="sort" onclick="sortBy('goals')">Sort: Goals</button>
<button class="sort" onclick="sortBy('assists')">Sort: Assists</button>
<button class="sort" onclick="sortBy('saves')">Sort: Saves</button>
<button class="reset" onclick="resetAll()">Reset Stats</button>
</div>

<section class="section">
<h2>🛡️ Golden Defense</h2>
<div class="rank-grid"><div class="rank-card">
<h3>Best Defense Rankings</h3>
<div id="defenseRanking"></div>
</div></div>
</section>

<section class="section">
<h2>🏆 Ballon d'Or</h2>
<div class="rank-grid"><div class="rank-card">
<h3>Player Rankings</h3>
<div id="ballonRanking"></div>
</div></div>
</section>

<section class="section">
<h2>⭐ MVP Match Awards</h2>
<div class="award-grid" id="awards"></div>
</section>

<section class="section">
<h2>📊 Player Stats</h2>
<table><thead><tr><th>#</th><th>Player</th><th>Goals</th><th>Assists</th><th>G+A</th><th>Saves</th></tr></thead>
<tbody id="leaderboard"></tbody></table>
</section>

<main class="grid" id="players"></main>
