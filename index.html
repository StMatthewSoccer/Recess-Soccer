<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saint Matthews Recess Soccer Live Stats</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background:
    linear-gradient(rgba(4,18,14,.78), rgba(4,18,14,.9)),
    radial-gradient(circle at 20% 20%, #176b45, transparent 35%),
    radial-gradient(circle at 80% 80%, #0b5135, transparent 35%),
    #061a13;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 22px 12px 14px;
}

header h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 42px);
}

header p {
  margin: 7px 0 0;
  color: #b9d8ca;
  font-size: 14px;
}

.container {
  width: min(1200px, 96%);
  margin: auto;
}

/* LOGIN */

.login-box {
  max-width: 420px;
  margin: 10px auto 22px;
  padding: 18px;
  background: rgba(10,35,27,.88);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;
}

.login-box h2 {
  margin: 0 0 12px;
  font-size: 19px;
}

.login-row {
  display: flex;
  gap: 8px;
}

select,
input,
button {
  font: inherit;
}

select,
input {
  min-width: 0;
  padding: 11px;
  border-radius: 9px;
  border: 1px solid #496b5d;
  background: #102d23;
  color: white;
}

.login-row select {
  flex: 1;
}

.login-row input {
  flex: 1;
}

button {
  cursor: pointer;
  border: none;
}

.login-button {
  width: 100%;
  margin-top: 9px;
  padding: 11px;
  border-radius: 9px;
  background: #27ae70;
  color: white;
  font-weight: bold;
}

.logout-button {
  width: 100%;
  margin-top: 8px;
  padding: 9px;
  border-radius: 9px;
  background: #613b3b;
  color: white;
}

.login-status {
  margin-top: 9px;
  font-size: 13px;
  color: #b9d8ca;
}

/* CONTROLS */

.section {
  margin: 20px 0;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.section-title h2 {
  margin: 0;
  font-size: 22px;
}

.editor-badge {
  display: none;
  font-size: 11px;
  padding: 5px 8px;
  border-radius: 20px;
  background: #1f8f5c;
}

body.editor-mode .editor-badge {
  display: inline-block;
}

/* STAT BUTTONS */

.sort-buttons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.sort-button {
  padding: 7px 9px;
  border-radius: 7px;
  background: #17382c;
  color: #cce6da;
  border: 1px solid #315849;
  font-size: 12px;
}

.sort-button.active {
  background: #27ae70;
  color: white;
  border-color: #27ae70;
}

/* STAT TABLE */

.table-wrap {
  overflow-x: auto;
  background: rgba(7,27,20,.9);
  border-radius: 13px;
  border: 1px solid rgba(255,255,255,.1);
}

.stats-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
}

.stats-table th {
  background: #102e23;
  color: #9ed2bb;
  font-size: 11px;
  padding: 8px 5px;
  white-space: nowrap;
}

.stats-table td {
  padding: 6px 4px;
  text-align: center;
  border-top: 1px solid rgba(255,255,255,.07);
  font-size: 13px;
}

.stats-table td.name {
  text-align: left;
  padding-left: 9px;
  font-weight: bold;
  white-space: nowrap;
}

.stats-table tr:nth-child(even) {
  background: rgba(255,255,255,.025);
}

.stat-number {
  min-width: 27px;
  display: inline-block;
  font-weight: bold;
}

.edit-cell {
  white-space: nowrap;
}

.edit-arrow {
  width: 25px;
  height: 25px;
  padding: 0;
  border-radius: 6px;
  background: #173f30;
  color: white;
  font-weight: bold;
  font-size: 15px;
  vertical-align: middle;
}

.edit-arrow:hover {
  background: #27ae70;
}

.edit-arrow.minus {
  color: #ffb1b1;
}

.edit-arrow.plus {
  color: #b5ffd9;
}

body:not(.editor-mode) .edit-arrow {
  display: none;
}

body:not(.editor-mode) .edit-cell .stat-number {
  min-width: 32px;
}

/* RANKINGS */

.rankings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.ranking-card {
  background: rgba(7,27,20,.9);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 15px;
  padding: 14px;
}

.trophy {
  width: 55px;
  height: 55px;
  object-fit: contain;
  display: block;
  margin: 0 auto 4px;
}

.ranking-card h2 {
  text-align: center;
  margin: 4px 0 13px;
  font-size: 20px;
}

.ranking-row {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 7px;
  align-items: center;
  padding: 7px 5px;
  border-top: 1px solid rgba(255,255,255,.07);
}

.rank-number {
  color: #9ed2bb;
  font-weight: bold;
}

.rank-name {
  font-weight: bold;
  min-width: 0;
}

.rank-controls {
  display: flex;
  gap: 4px;
}

.rank-arrow {
  width: 29px;
  height: 29px;
  border-radius: 6px;
  background: #173f30;
  color: white;
  font-weight: bold;
}

.rank-arrow:disabled {
  opacity: .25;
  cursor: default;
}

body:not(.editor-mode) .rank-controls {
  display: none;
}

.save-ranking {
  width: 100%;
  padding: 9px;
  margin-top: 10px;
  border-radius: 8px;
  background: #246f50;
  color: white;
  font-weight: bold;
}

body:not(.editor-mode) .save-ranking {
  display: none;
}

.save-message {
  text-align: center;
  margin-top: 7px;
  color: #9ed2bb;
  font-size: 12px;
}

/* MOBILE */

@media (max-width: 700px) {
  header {
    padding-top: 15px;
  }

  .login-row {
    flex-direction: column;
  }

  .rankings-grid {
    grid-template-columns: 1fr;
  }

  .section-title h2 {
    font-size: 19px;
  }

  .stats-table {
    min-width: 700px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Saint Matthews Recess Soccer</h1>
  <p>Live Stats & Rankings</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div class="login-box">
    <h2>🔐 Editor Login</h2>

    <div class="login-row">
      <select id="username">
        <option value="">Select username</option>
        <option value="jack">jack</option>
        <option value="jackschool">jackschool</option>
        <option value="leonardo">leonardo</option>
        <option value="angelo">angelo</option>
      </select>

      <input
        type="password"
        id="pin"
        placeholder="PIN / Password"
        autocomplete="current-password"
      >
    </div>

    <button class="login-button" id="loginButton">
      Sign In
    </button>

    <button class="logout-button" id="logoutButton" style="display:none;">
      Sign Out
    </button>

    <div class="login-status" id="loginStatus">
      View-only mode
    </div>
  </div>

  <!-- PLAYER STATS -->
  <section class="section">

    <div class="section-title">
      <h2>📊 Player Stats</h2>
      <span class="editor-badge">EDITOR MODE</span>
    </div>

    <div class="sort-buttons" id="sortButtons">
      <button class="sort-button active" data-stat="name">Names</button>
      <button class="sort-button" data-stat="goals">Goals</button>
      <button class="sort-button" data-stat="assists">Assists</button>
      <button class="sort-button" data-stat="ga">G+A</button>
      <button class="sort-button" data-stat="saves">Saves</button>
      <button class="sort-button" data-stat="cleanSheets">Clean Sheets</button>
      <button class="sort-button" data-stat="yellow">Yellow</button>
      <button class="sort-button" data-stat="red">Red</button>
      <button class="sort-button" data-stat="mvps">MVPs</button>
    </div>

    <div class="table-wrap">
      <table class="stats-table">
        <thead>
          <tr>
            <th>PLAYER</th>
            <th>GOALS</th>
            <th>ASSISTS</th>
            <th>G+A</th>
            <th>SAVES</th>
            <th>CLEAN<br>SHEETS</th>
            <th>YELLOW</th>
            <th>RED</th>
            <th>MVPS</th>
          </tr>
        </thead>

        <tbody id="statsBody"></tbody>
      </table>
    </div>

  </section>

  <!-- RANKINGS -->
  <section class="section">

    <div class="section-title">
      <h2>🏆 Rankings</h2>
    </div>

    <div class="rankings-grid">

      <!-- GOLDEN DEFENCE -->
      <div class="ranking-card">

        <img
          class="trophy"
          src="Screenshot_20260826-003116.png"
          alt="Golden Defence trophy"
          onerror="this.style.display='none'"
        >

        <h2>🛡️ Golden Defence</h2>

        <div id="defenceRanking"></div>

        <button class="save-ranking" id="saveDefence">
          Save Golden Defence
        </button>

        <div class="save-message" id="defenceMessage"></div>
      </div>

      <!-- BALLON D'OR -->
      <div class="ranking-card">

        <img
          class="trophy"
          src="Screenshot_20260826-003131.png"
          alt="Ballon d'Or trophy"
          onerror="this.style.display='none'"
        >

        <h2>🏆 Ballon d'Or</h2>

        <div id="ballonRanking"></div>

        <button class="save-ranking" id="saveBallon">
          Save Ballon d'Or
        </button>

        <div class="save-message" id="ballonMessage"></div>
      </div>

    </div>

  </section>

</div>

<script>
/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {
  apiKey: "AIzaSyCyXvJ6IxdE5Nj-J-0YEfipH7CMNZa_RUI",
  authDomain: "recess-soccer.firebaseapp.com",
  databaseURL: "https://recess-soccer-default-rtdb.firebaseio.com",
  projectId: "recess-soccer",
  storageBucket: "recess-soccer.firebasestorage.app",
  messagingSenderId: "872558689342",
  appId: "1:872558689342:web:a4dca17e1d6b963ed6656f",
  measurementId: "G-HJ16JSL5Q2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


/* ==============================
   EDITOR ACCOUNTS
============================== */

const editors = {
  jack: {
    email: "jmaso12.home@gmail.com",
    name: "Jack"
  },

  jackschool: {
    email: "jack.mason1@stu.ocsb.ca",
    name: "Jack (School)"
  },

  leonardo: {
    email: "leonardo.ljubicic@stu.ocsb.ca",
    name: "Leonardo"
  },

  angelo: {
    email: "angelo.champagne@stu.ocsb.ca",
    name: "Angelo"
  }
};


/* ==============================
   PLAYERS
============================== */

const PLAYER_NAMES = [
  "Adi",
  "Aidan",
  "Artin",
  "Angelo",
  "Bryson",
  "Cameron",
  "Jack",
  "John",
  "Leonardo",
  "Marc",
  "Matthew",
  "Sami",
  "Nathan",
  "Theo"
];


/* ==============================
   DEFAULT STATS
============================== */

const defaultStats = {
  goals: 0,
  assists: 0,
  saves: 0,
  cleanSheets: 0,
  yellow: 0,
  red: 0,
  mvps: 0
};

let playerStats = {};
let currentSort = "name";


/* ==============================
   RANKINGS
============================== */

let ballonRanking = [...PLAYER_NAMES];
let defenceRanking = [...PLAYER_NAMES];


/* ==============================
   CREATE DEFAULT DATA
============================== */

PLAYER_NAMES.forEach(name => {
  playerStats[name] = {
    ...defaultStats
  };
});


/* ==============================
   HTML ESCAPE
============================== */

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ==============================
   STAT VALUE
============================== */

function getStat(name, stat) {
  const stats = playerStats[name] || defaultStats;

  if (stat === "ga") {
    return Number(stats.goals || 0) + Number(stats.assists || 0);
  }

  return Number(stats[stat] || 0);
}


/* ==============================
   RENDER PLAYER TABLE
============================== */

function renderTable() {

  const body = document.getElementById("statsBody");

  let names = [...PLAYER_NAMES];

  if (currentSort !== "name") {
    names.sort((a, b) => {

      const difference =
        getStat(b, currentSort) -
        getStat(a, currentSort);

      if (difference !== 0) {
        return difference;
      }

      return PLAYER_NAMES.indexOf(a) -
             PLAYER_NAMES.indexOf(b);
    });
  }

  body.innerHTML = "";

  names.forEach(name => {

    const stats = playerStats[name];

    const row = document.createElement("tr");

    row.innerHTML = `
      <td class="name">${escapeHTML(name)}</td>

      ${createStatCell(name, "goals")}
      ${createStatCell(name, "assists")}

      <td>
        <span class="stat-number">
          ${getStat(name, "ga")}
        </span>
      </td>

      ${createStatCell(name, "saves")}
      ${createStatCell(name, "cleanSheets")}
      ${createStatCell(name, "yellow")}
      ${createStatCell(name, "red")}
      ${createStatCell(name, "mvps")}
    `;

    body.appendChild(row);
  });
}


/* ==============================
   CREATE +/- CELL
============================== */

function createStatCell(name, stat) {

  const value = getStat(name, stat);

  return `
    <td class="edit-cell">

      <button
        type="button"
        class="edit-arrow minus"
        data-player="${escapeHTML(name)}"
        data-stat="${stat}"
        data-change="-1"
        aria-label="Remove one ${stat} from ${escapeHTML(name)}"
      >−</button>

      <span class="stat-number">${value}</span>

      <button
        type="button"
        class="edit-arrow plus"
        data-player="${escapeHTML(name)}"
        data-stat="${stat}"
        data-change="1"
        aria-label="Add one ${stat} to ${escapeHTML(name)}"
      >+</button>

    </td>
  `;
}


/* ==============================
   STAT BUTTON SORTING
============================== */

document
  .getElementById("sortButtons")
  .addEventListener("click", event => {

    const button =
      event.target.closest(".sort-button");

    if (!button) return;

    currentSort =
      button.dataset.stat;

    document
      .querySelectorAll(".sort-button")
      .forEach(btn => {
        btn.classList.remove("active");
      });

    button.classList.add("active");

    renderTable();
  });


/* ==============================
   EDIT STATS
============================== */

document
  .getElementById("statsBody")
  .addEventListener("click", async event => {

    const button =
      event.target.closest(".edit-arrow");

    if (!button) return;

    if (!auth.currentUser) {
      alert("You must sign in as an editor first.");
      return;
    }

    const name = button.dataset.player;
    const stat = button.dataset.stat;
    const change = Number(button.dataset.change);

    if (!playerStats[name]) {
      playerStats[name] = {
        ...defaultStats
      };
    }

    const oldValue =
      Number(playerStats[name][stat] || 0);

    const newValue =
      Math.max(0, oldValue + change);

    playerStats[name][stat] = newValue;

    renderTable();

    try {

      await db
        .ref("players/" + name)
        .update({
          [stat]: newValue
        });

    } catch (error) {

      console.error(error);

      alert(
        "The number changed on screen, but Firebase could not save it."
      );
    }
  });


/* ==============================
   LOAD PLAYER STATS
============================== */

db.ref("players").on(
  "value",
  snapshot => {

    const data =
      snapshot.val() || {};

    PLAYER_NAMES.forEach(name => {

      const saved =
        data[name] || {};

      playerStats[name] = {
        ...defaultStats,
        ...saved
      };
    });

    renderTable();
  },
  error => {

    console.error(
      "Firebase player listener:",
      error
    );

    renderTable();
  }
);


/* ==============================
   NORMALIZE RANKING
============================== */

function normalizeRanking(saved) {

  const result = [];

  if (Array.isArray(saved)) {

    saved.forEach(name => {

      if (
        PLAYER_NAMES.includes(name) &&
        !result.includes(name)
      ) {
        result.push(name);
      }
    });
  }

  PLAYER_NAMES.forEach(name => {

    if (!result.includes(name)) {
      result.push(name);
    }
  });

  return result;
}


/* ==============================
   RENDER BALLON D'OR
============================== */

function renderBallonRanking() {

  const container =
    document.getElementById("ballonRanking");

  container.innerHTML = "";

  ballonRanking.forEach((name, index) => {

    const row =
      document.createElement("div");

    row.className = "ranking-row";

    row.innerHTML = `
      <span class="rank-number">
        ${index + 1}
      </span>

      <span class="rank-name">
        ${escapeHTML(name)}
      </span>

      <div class="rank-controls">

        <button
          type="button"
          class="rank-arrow"
          data-ranking="ballon"
          data-index="${index}"
          data-direction="-1"
          ${index === 0 ? "disabled" : ""}
        >↑</button>

        <button
          type="button"
          class="rank-arrow"
          data-ranking="ballon"
          data-index="${index}"
          data-direction="1"
          ${index === ballonRanking.length - 1 ? "disabled" : ""}
        >↓</button>

      </div>
    `;

    container.appendChild(row);
  });
}


/* ==============================
   RENDER GOLDEN DEFENCE
============================== */

function renderDefenceRanking() {

  const container =
    document.getElementById("defenceRanking");

  container.innerHTML = "";

  defenceRanking.forEach((name, index) => {

    const row =
      document.createElement("div");

    row.className = "ranking-row";

    row.innerHTML = `
      <span class="rank-number">
        ${index + 1}
      </span>

      <span class="rank-name">
        ${escapeHTML(name)}
      </span>

      <div class="rank-controls">

        <button
          type="button"
          class="rank-arrow"
          data-ranking="defence"
          data-index="${index}"
          data-direction="-1"
          ${index === 0 ? "disabled" : ""}
        >↑</button>

        <button
          type="button"
          class="rank-arrow"
          data-ranking="defence"
          data-index="${index}"
          data-direction="1"
          ${index === defenceRanking.length - 1 ? "disabled" : ""}
        >↓</button>

      </div>
    `;

    container.appendChild(row);
  });
}


/* ==============================
   RANKING ARROWS
============================== */

document.addEventListener("click", event => {

  const button =
    event.target.closest(".rank-arrow");

  if (!button) return;

  if (!auth.currentUser) {
    alert("You must sign in as an editor first.");
    return;
  }

  const ranking =
    button.dataset.ranking;

  const index =
    Number(button.dataset.index);

  const direction =
    Number(button.dataset.direction);

  const list =
    ranking === "ballon"
      ? ballonRanking
      : defenceRanking;

  const newIndex =
    index + direction;

  if (
    newIndex < 0 ||
    newIndex >= list.length
  ) {
    return;
  }

  [
    list[index],
    list[newIndex]
  ] = [
    list[newIndex],
    list[index]
  ];

  if (ranking === "ballon") {
    renderBallonRanking();
  } else {
    renderDefenceRanking();
  }
});


/* ==============================
   SAVE BALLON
============================== */

document
  .getElementById("saveBallon")
  .addEventListener("click", async () => {

    if (!auth.currentUser) {
      alert("You must sign in first.");
      return;
    }

    try {

      await db
        .ref("rankings/ballon")
        .set(ballonRanking);

      document
        .getElementById("ballonMessage")
        .textContent =
        "Ballon d'Or ranking saved.";

    } catch (error) {

      console.error(error);

      document
        .getElementById("ballonMessage")
        .textContent =
        "Could not save ranking.";
    }
  });


/* ==============================
   SAVE DEFENCE
============================== */

document
  .getElementById("saveDefence")
  .addEventListener("click", async () => {

    if (!auth.currentUser) {
      alert("You must sign in first.");
      return;
